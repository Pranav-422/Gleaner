[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "httpx2>=2.16.2",
    "keyring>=25.7.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
